name: Legal pages CI (link check + visual smoke)

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: legal-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Check pages (broken links, console/page errors, screenshots)
        run: npm run check:pages

      - name: Upload page screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: legal-page-screenshots
          path: .ci-reports/
          retention-days: 14
